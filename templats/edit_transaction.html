<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        💰 Finance Dashboard
    </div>

    <div class="nav-right">

        <a
            href="{{ url_for('dashboard') }}"
            class="back-btn"
        >
            ← Dashboard
        </a>

        <a
            href="{{ url_for('logout') }}"
            class="logout-btn"
        >
            Logout
        </a>

    </div>

</nav>



<!-- EDIT CONTAINER -->

<div class="edit-container">

    <div class="section-card">

        <div class="section-title">

            <h2>
                ✏️ Edit Transaction
            </h2>

            <p>
                Update your transaction details
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for(
                'edit_transaction',
                transaction_id=transaction.id
            ) }}"
            class="transaction-form"
        >


            <!-- AMOUNT -->

            <div class="form-group">

                <label>
                    Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    value="{{ transaction.amount }}"
                    required
                >

            </div>


            <!-- TYPE -->

            <div class="form-group">

                <label>
                    Type
                </label>

                <select
                    name="type"
                    id="editType"
                    required
                    onchange="filterEditCategories()"
                >

                    <option
                        value="Income"
                        {% if transaction.type == "Income" %}
                        selected
                        {% endif %}
                    >
                        Income
                    </option>

                    <option
                        value="Expense"
                        {% if transaction.type == "Expense" %}
                        selected
                        {% endif %}
                    >
                        Expense
                    </option>

                </select>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    name="category_id"
                    id="editCategory"
                    required
                >

                    {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        data-type="{{ category.type }}"
                        {% if category.id == transaction.category_id %}
                        selected
                        {% endif %}
                    >

                        {{ category.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Date
                </label>

                <input
                    type="date"
                    name="transaction_date"
                    value="{{ transaction.transaction_date }}"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group full-width">

                <label>
                    Description
                </label>

                <input
                    type="text"
                    name="description"
                    value="{{ transaction.description or '' }}"
                    maxlength="255"
                    placeholder="Enter description"
                >

            </div>


            <!-- BUTTONS -->

            <div class="edit-actions full-width">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    💾 Save Changes
                </button>


                <a
                    href="{{ url_for('dashboard') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>

</div>



<script>

function filterEditCategories() {

    const type =
        document.getElementById(
            "editType"
        ).value;


    const category =
        document.getElementById(
            "editCategory"
        );


    const options =
        category.querySelectorAll(
            "option"
        );


    options.forEach(
        function(option) {

            if (
                option.dataset.type === type
            ) {

                option.style.display =
                    "block";

            } else {

                option.style.display =
                    "none";

            }

        }
    );

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        filterEditCategories();

    }
);

</script>


</body>

</html>
