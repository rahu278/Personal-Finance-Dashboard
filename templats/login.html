<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Finance Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                💰
            </div>

            <h1>
                Finance Dashboard
            </h1>

            <p class="auth-subtitle">
                Manage your personal finances easily
            </p>


            <form method="POST"
                  action="{{ url_for('login') }}">


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    🔐 Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
